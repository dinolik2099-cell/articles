<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>给生活留一段空白，才能听见内心的声音</title><style>body{max-width:760px;margin:40px auto;padding:0 20px;font:18px/1.8 system-ui;color:#222}img{max-width:100%;height:auto}</style></head><body><article><h1>给生活留一段空白，才能听见内心的声音</h1><p>给生活留一段空白，才能听见内心的声音</p><p>每天都被消息和日程填满，人很容易变得麻木。偶尔关掉手机半小时，坐在窗边发会儿呆，你会发现那些原本想不通的问题，在安静里自己就松开了。</p></article></body></html>
