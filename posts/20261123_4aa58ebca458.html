<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>把脚步放慢一点</title><style>body{max-width:760px;margin:40px auto;padding:0 20px;font:18px/1.8 system-ui;color:#222}img{max-width:100%;height:auto}</style></head><body><article><h1>把脚步放慢一点</h1><p>把脚步放慢一点</p><p>赶路的时候，我们总盯着远方的终点，却忽略了脚下盛开的野花。偶尔放慢脚步，并不是停滞不前，而是为了听见内心真实的声音。</p></article></body></html>
