<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>学会把大问题拆小，焦虑就会少一半</title><style>body{max-width:760px;margin:40px auto;padding:0 20px;font:18px/1.8 system-ui;color:#222}img{max-width:100%;height:auto}</style></head><body><article><h1>学会把大问题拆小，焦虑就会少一半</h1><p>学会把大问题拆小，焦虑就会少一半</p><p>面对一团乱麻的任务时，最消耗精力的不是动手去做，而是反复想着它有多难。拿一张纸写下今天能完成的三件小事，做完一件划掉一件，心就定了。</p></article></body></html>
